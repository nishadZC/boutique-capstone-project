apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nishadZC/boutique-capstone-project'
    targetRevision: dev-aws
    path: gitops/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique-dev
  # syncPolicy: {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
