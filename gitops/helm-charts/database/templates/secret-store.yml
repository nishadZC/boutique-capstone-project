apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      # The Azure Key Vault URL will need to be configured or handled via variables
      vaultUrl: "https://boutique-dev-kv.vault.azure.net"
      authType: ManagedIdentity
      # Use the AKS system assigned identity
