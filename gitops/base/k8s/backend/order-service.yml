apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 368763425814.dkr.ecr.us-east-1.amazonaws.com/order-service:b6f78d7cc11d1d9a58e7b7e5842e1ff12fb9d9ee
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3004"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: ORDERS_DB_URL
            - name: AUTH_SERVICE_URL
              value: "http://auth:3002"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3003"

---

apiVersion: v1
kind: Service
metadata:
  name: order-service

spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      name: http
      port: 3004
      targetPort: 3004
  type: ClusterIP
