apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: 368763425814.dkr.ecr.us-east-1.amazonaws.com/auth:71fad1d1af727475293120adf3787f7ad02f6649
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: AUTH_DB_URL

--- 

apiVersion: v1
kind: Service
metadata:
  name: auth

spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      name: http
      port: 3002
      targetPort: 3002
  type: ClusterIP
