apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 368763425814.dkr.ecr.us-east-1.amazonaws.com/user-service:f77147514a87a9997117b2996452880f7d36cce4
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: USERS_DB_URL

--- 

apiVersion: v1
kind: Service
metadata:
  name: user-service

spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      name: http
      port: 3006
      targetPort: 3006
  type: ClusterIP
