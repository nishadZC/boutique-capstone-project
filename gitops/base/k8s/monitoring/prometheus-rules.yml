apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auth-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: AuthAlerts
      rules:
        - alert: HighTraffic
          expr: sum(rate(http_requests_total[1m])) by (route, job, namespace) > 10
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "High Traffic on route {{ $labels.route }} ({{ $labels.job }})"
            description: >
              Route '{{ $labels.route }}' in service '{{ $labels.job }}'
              (namespace: {{ $labels.namespace }}) is receiving
              {{ printf \"%.2f\" $value }} requests/sec, which exceeds the threshold of 10 req/s.
