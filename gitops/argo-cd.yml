apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nishadZC/devops-playbook.git'
    targetRevision: main
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  # syncPolicy: {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  #   syncOptions:
  #     - CreateNamespace=true
