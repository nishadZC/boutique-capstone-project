---
- name: Install and configure SonarQube
  hosts: sonarqube
  become: yes
  vars:
    sonarqube_version: "9.9.1.69595"
    postgresql_version: "14"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - openjdk-17-jdk
          - wget
          - unzip
          - acl
          - postgresql
          - postgresql-contrib
        state: present

    - name: Create PostgreSQL user for SonarQube
      become_user: postgres
      postgresql_user:
        name: sonar
        password: sonarpassword
        state: present

    - name: Create PostgreSQL database for SonarQube
      become_user: postgres
      postgresql_db:
        name: sonarqube
        owner: sonar
        state: present

    - name: Increase vm.max_map_count for Elasticsearch (SonarQube dependency)
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        sysctl_set: yes

    - name: Increase fs.file-max
      sysctl:
        name: fs.file-max
        value: '65536'
        state: present
        sysctl_set: yes

    - name: Add SonarQube group
      group:
        name: sonar
        state: present

    - name: Add SonarQube user
      user:
        name: sonar
        group: sonar
        system: yes
        shell: /bin/bash

    - name: Download SonarQube
      get_url:
        url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
        dest: "/tmp/sonarqube-{{ sonarqube_version }}.zip"

    - name: Unzip SonarQube
      unarchive:
        src: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        dest: /opt/
        remote_src: yes
        creates: "/opt/sonarqube-{{ sonarqube_version }}"

    - name: Symlink SonarQube directory
      file:
        src: "/opt/sonarqube-{{ sonarqube_version }}"
        dest: /opt/sonarqube
        state: link

    - name: Set ownership of SonarQube directory
      file:
        path: "/opt/sonarqube-{{ sonarqube_version }}"
        owner: sonar
        group: sonar
        recurse: yes

    - name: Configure SonarQube properties (JDBC URL)
      lineinfile:
        path: /opt/sonarqube/conf/sonar.properties
        regexp: '^#?sonar\.jdbc\.url='
        line: 'sonar.jdbc.url=jdbc:postgresql://localhost/sonarqube'

    - name: Configure SonarQube properties (JDBC Username)
      lineinfile:
        path: /opt/sonarqube/conf/sonar.properties
        regexp: '^#?sonar\.jdbc\.username='
        line: 'sonar.jdbc.username=sonar'

    - name: Configure SonarQube properties (JDBC Password)
      lineinfile:
        path: /opt/sonarqube/conf/sonar.properties
        regexp: '^#?sonar\.jdbc\.password='
        line: 'sonar.jdbc.password=sonarpassword'

    - name: Create SonarQube systemd service
      copy:
        dest: /etc/systemd/system/sonarqube.service
        content: |
          [Unit]
          Description=SonarQube service
          After=syslog.target network.target

          [Service]
          Type=forking
          ExecStart=/opt/sonarqube/bin/linux-x86-64/sonar.sh start
          ExecStop=/opt/sonarqube/bin/linux-x86-64/sonar.sh stop
          User=sonar
          Group=sonar
          Restart=always
          LimitNOFILE=65536
          LimitNPROC=4096

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable SonarQube service
      systemd:
        name: sonarqube
        state: started
        enabled: yes
        daemon_reload: yes
